packages:
  - 'packages/**'
  - 'apps/**'

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: false
  esbuild: true
  mozjpeg: true
  pngquant-bin: true

# Exclude dependency versions published less than 3 days (4320 minutes) ago (pnpm 11 supply-chain protection).
minimumReleaseAge: 4320

overrides:
  '@types/node': ^24.13.2
  # stylelint-config-recommended-vue@1.6.1 pulls stylelint-config-recommended via
  # an open `>=6.0.0` range that resolves to a stylelint 16-era version; pin it to
  # the stylelint 17 compatible major to match the rest of the toolchain.
  stylelint-config-recommended: ^18.0.0
  # Pin the whole Vue family to a single version across the workspace. Vue is a
  # singleton and its internal @vue/* packages cross-depend by exact version, so
  # letting any of them float duplicates Vue's module identity and breaks
  # JSX / VNode type-checking. The @vue/* packages below are never declared
  # directly by a workspace package, so overrides are the only way to hold them
  # together. Overrides affect install-time resolution only; published
  # peerDependencies keep their own ranges.
  #
  # Note for 3.5.40+: @vue/server-renderer no longer peer-depends on `vue` and
  # imports @vue/runtime-dom directly (vuejs/core#15063), which would load Vue
  # twice in vot's SSR build. The `vite:vot-vue-runtime-dom` plugin in
  # packages/vot/src/tool/index.ts sends that import back to `vue`; keep it in
  # place while these overrides track 3.5.40 or newer.
  vue: 3.5.40
  '@vue/compiler-core': 3.5.40
  '@vue/compiler-dom': 3.5.40
  '@vue/compiler-sfc': 3.5.40
  '@vue/compiler-ssr': 3.5.40
  '@vue/reactivity': 3.5.40
  '@vue/runtime-core': 3.5.40
  '@vue/runtime-dom': 3.5.40
  '@vue/server-renderer': 3.5.40
  '@vue/shared': 3.5.40

peerDependencyRules:
  allowedVersions:
    # nunjucks declares chokidar as an optional peer pinned to ^3.3.0 (used only
    # for its own file-watching, which we don't use). chokidar 5 is intentionally
    # installed as a direct dependency of @fastkit/icon-font-gen.
    chokidar: '5'
